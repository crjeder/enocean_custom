name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/test-runner/Dockerfile', 'docker-compose.test.yml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test-runner image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/test-runner
          file: ./docker/test-runner/Dockerfile
          load: true
          tags: enocean-test-runner:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Workaround for cache growth (https://github.com/docker/build-push-action/issues/252)
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create results directory
        run: mkdir -p test-results

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner \
            --no-color

      - name: Copy test results from volume
        if: always()
        run: |
          docker run --rm \
            -v enocean_custom_ha-results:/results \
            -v "$(pwd)/test-results":/out \
            alpine sh -c "cp /results/test-results.xml /out/ 2>/dev/null || true"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/test-results.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
